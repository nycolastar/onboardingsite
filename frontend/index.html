<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Trade Marketing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow p-4">
    <h1 class="mb-3">Portal de Onboarding</h1>

    <p>Preencha as informações da implantação abaixo.</p>

    <form id="onboardingForm">

      <div class="mb-3">
        <label class="form-label">Nome da Loja</label>
        <input type="text" class="form-control" name="nome_loja" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Cidade</label>
        <input type="text" class="form-control" name="cidade">
      </div>

      <div class="mb-3">
        <label class="form-label">UF</label>
        <input type="text" class="form-control" name="uf">
      </div>

      <div class="mb-3">
        <label class="form-label">Email do Responsável</label>
        <input type="email" class="form-control" name="email">
      </div>

      <button type="submit" class="btn btn-primary">
        Salvar Onboarding
      </button>

    </form>

    <div id="resultado" class="mt-4"></div>
  </div>
</div>

<script>
document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  const response = await fetch('http://localhost/onboarding-system/backend/api/save_onboarding.php', {
    method: 'POST',
    body: formData
  });

  const result = await response.json();

  document.getElementById('resultado').innerHTML = `
    <div class="alert alert-success">
      ${result.message}
    </div>
    <pre>${result.sql}</pre>
  `;
});
</script>

</body>
</html>
