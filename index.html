<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #330066;
      --brand-dark: #230047;
      --brand-soft: #efe6f7;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d7dde5;
      --surface: #f5f7fa;
      --ok: #067647;
      --warn: #b54708;
    }

    body {
      background: var(--surface);
      color: var(--ink);
    }

    .app-shell {
      max-width: 1180px;
    }

    .topbar {
      background: var(--brand);
      color: #fff;
    }

    .topbar small {
      color: #e4d4f2;
    }

    .brand-logo {
      background: #fff;
      border-radius: 8px;
      height: 52px;
      width: 130px;
      object-fit: contain;
      padding: .45rem .7rem;
    }

    .nav-pills {
      gap: .35rem;
    }

    .nav-pills .nav-link {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
      text-align: left;
    }

    .nav-pills .nav-link.active {
      background: var(--brand);
      border-color: var(--brand);
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(51, 0, 102, .08);
    }

    .login-panel {
      max-width: 460px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .section-description {
      color: var(--muted);
      margin-bottom: 0;
    }

    .form-label {
      font-weight: 600;
    }

    .text-bg-secondary {
      background-color: var(--brand-soft) !important;
      color: var(--brand) !important;
      border: 1px solid #ddc7ef;
    }

    .required::after {
      content: " *";
      color: #b42318;
    }

    .btn-primary {
      --bs-btn-bg: var(--brand);
      --bs-btn-border-color: var(--brand);
      --bs-btn-hover-bg: var(--brand-dark);
      --bs-btn-hover-border-color: var(--brand-dark);
    }

    .pin-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .5rem;
    }

    .status-chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .55rem .65rem;
      background: #fff;
      font-size: .9rem;
    }

    .status-chip.sent {
      border-color: #abefc6;
      background: #ecfdf3;
      color: var(--ok);
    }

    .status-chip.missing {
      border-color: #fedf89;
      background: #fffaeb;
      color: var(--warn);
    }

    pre {
      white-space: pre-wrap;
      background: #101828;
      color: #f2e8fb;
      border-radius: 8px;
      padding: 1rem;
      margin: .75rem 0 0;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container app-shell py-3">
      <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-3">
          <img class="brand-logo" src="assets/mc.png" alt="Meu Cliente">
          <div>
            <h1 class="h3 mb-1" id="appTitle">Onboarding</h1>
            <small id="appSubtitle">Acesse com seu PIN para continuar.</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge text-bg-light" id="sessionBadge">Login</span>
          <button class="btn btn-sm btn-outline-light" id="logoutButton" type="button" hidden>Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container app-shell py-4">
    <section class="panel login-panel p-4" id="loginView">
      <div class="mb-4">
        <div class="section-title">Entrar com PIN</div>
        <p class="section-description">Use o PIN do cliente ou o PIN admin.</p>
      </div>
      <form class="row g-3" id="loginForm">
        <div class="col-12">
          <label class="form-label required" for="pin">PIN</label>
          <input class="form-control form-control-lg text-uppercase pin-code" id="pin" name="pin" autocomplete="one-time-code" maxlength="20" required>
        </div>
        <div class="col-12 d-grid">
          <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
        </div>
      </form>
      <div id="loginResult" class="mt-3"></div>
    </section>

    <section id="adminView" hidden>
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="panel p-4">
            <div class="mb-4">
              <div class="section-title">Criar usuario</div>
              <p class="section-description">O PIN e gerado automaticamente e vinculado ao nome informado.</p>
            </div>
            <form class="row g-3" id="createUserForm">
              <div class="col-12">
                <label class="form-label required" for="userName">Nome do usuario</label>
                <input class="form-control" id="userName" name="nome" placeholder="Meu Cliente x Coop" required>
              </div>
              <div class="col-12 d-grid">
                <button class="btn btn-primary" type="submit">Gerar PIN</button>
              </div>
            </form>
            <div id="createUserResult" class="mt-3"></div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="panel p-4">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
              <div>
                <div class="section-title">Usuarios e envios</div>
                <p class="section-description">Acompanhe os PINs e o que cada cliente ja enviou.</p>
              </div>
              <button class="btn btn-outline-secondary" id="refreshUsersButton" type="button">Atualizar</button>
            </div>
            <div id="usersList"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="userView" hidden>
      <div class="row g-3">
        <aside class="col-lg-3">
          <nav class="nav nav-pills flex-column" id="sectionTabs" aria-label="Abas de cadastro"></nav>
        </aside>

        <section class="col-lg-9">
          <div class="panel p-4">
            <div class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-4">
              <div>
                <div class="section-title" id="sectionTitle"></div>
                <p class="section-description" id="sectionDescription"></p>
              </div>
              <span class="badge rounded-pill text-bg-secondary" id="sectionBadge"></span>
            </div>

            <form id="onboardingForm" class="row g-3"></form>
            <div id="resultado" class="mt-4"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const sections = [
      {
        id: 'dados_loja',
        label: 'Dados de Loja',
        badge: 'Dados de Loja',
        description: 'Campos da aba Nome Fantasia, CNPJ, razao social, sigla, formato, bandeira e endereco.',
        fields: [
          { name: 'nome_fantasia', label: 'Nome Fantasia', required: true },
          { name: 'cnpj', label: 'CNPJ' },
          { name: 'razao_social', label: 'Razao Social', full: true },
          { name: 'sigla_loja', label: 'Sigla - Loja' },
          { name: 'formato', label: 'Formato' },
          { name: 'bandeira', label: 'Bandeira' },
          { name: 'cep', label: 'CEP' },
          { name: 'endereco', label: 'Endereco', full: true },
          { name: 'complemento', label: 'Complemento' },
          { name: 'regiao', label: 'Regiao' }
        ]
      },
      {
        id: 'categorias',
        label: 'Categoria',
        badge: 'Categoria',
        description: 'Cadastro de categoria, setor e departamento.',
        fields: [
          { name: 'categoria', label: 'Categoria', required: true },
          { name: 'setor', label: 'Setor' },
          { name: 'departamento', label: 'Departamento' }
        ]
      },
      {
        id: 'ativos_fisicos',
        label: 'Ativos Fisicos',
        badge: 'Ativos Fisicos',
        description: 'Ativos por loja, com valor de custo, venda e quantidade.',
        fields: [
          { name: 'nome_ativo', label: 'Nome do ativo', required: true, full: true },
          { name: 'valor_custo', label: 'Valor de custo', type: 'number', step: '0.01' },
          { name: 'valor_venda', label: 'Valor de venda', type: 'number', step: '0.01' },
          { name: 'loja', label: 'Loja' },
          { name: 'quantidade', label: 'Quantidade' },
          { name: 'observacoes', label: 'Observacoes', type: 'textarea', full: true }
        ]
      },
      {
        id: 'usuarios_internos',
        label: 'Usuarios Internos',
        badge: 'Usuarios Internos',
        description: 'Pessoas internas envolvidas, e-mail, WhatsApp e area.',
        fields: [
          { name: 'nome', label: 'Nome', required: true },
          { name: 'email', label: 'E-mail', type: 'email' },
          { name: 'whatsapp', label: 'Whatsapp' },
          { name: 'area', label: 'Area' }
        ]
      },
      {
        id: 'gerentes_loja',
        label: 'Gerente de loja',
        badge: 'Gerente de loja',
        description: 'Gerentes ou e-mails das lojas e a loja responsavel.',
        fields: [
          { name: 'nome', label: 'Nome/Nome da loja', required: true },
          { name: 'email', label: 'E-mail ou e-mail da loja', type: 'email' },
          { name: 'whatsapp', label: 'Whatsapp' },
          { name: 'loja_responsavel', label: 'Loja responsavel' }
        ]
      },
      {
        id: 'industrias',
        label: 'Industrias',
        badge: 'Industrias',
        description: 'Cadastro usado quando nao houver integracao com ERP.',
        fields: [
          { name: 'cnpj_industria', label: 'CNPJ Industria', required: true },
          { name: 'razao_social', label: 'Razao Social', full: true },
          { name: 'nome_fantasia', label: 'Nome Fantasia' },
          { name: 'codigo_interno', label: 'Codigo Interno' },
          { name: 'nome_representante', label: 'Nome do representante' },
          { name: 'telefone_representante', label: 'Telefone do representante' },
          { name: 'email_representante', label: 'E-mail do representante', type: 'email' },
          { name: 'whatsapp_representante', label: 'WhatsApp do representante' },
          { name: 'segmento', label: 'Segmento' },
          { name: 'faturamento', label: 'Faturamento', type: 'number', step: '0.01' }
        ]
      },
      {
        id: 'dados_bancarios',
        label: 'Dados Bancarios',
        badge: 'Dados Bancarios',
        description: 'Tipos de pagamento aceitos no projeto.',
        fields: [
          { name: 'tipo_pagamento', label: 'Tipo de pagamento', required: true, type: 'select', options: ['Bonificacao', 'Deposito', 'Pix', 'Abatimento em Duplicata'] },
          { name: 'observacoes', label: 'Observacoes', type: 'textarea', full: true }
        ]
      },
      {
        id: 'plantas_loja',
        label: 'Planta de loja',
        badge: 'Planta de loja',
        description: 'Referencia da pasta ou link para upload das plantas de loja.',
        fields: [
          { name: 'pasta_upload', label: 'Pasta para upload', required: true, full: true },
          { name: 'link_pasta', label: 'Link da pasta', type: 'url', full: true },
          { name: 'observacoes', label: 'Observacoes', type: 'textarea', full: true }
        ]
      },
      {
        id: 'ativos_digitais',
        label: 'Ativos Digitais',
        badge: 'Ativos Digitais',
        description: 'Ativos digitais com valor e canal/loja digital.',
        fields: [
          { name: 'nome_ativo', label: 'Nome do ativo', required: true },
          { name: 'valor_custo', label: 'Valor de custo', type: 'number', step: '0.01' },
          { name: 'valor_venda', label: 'Valor de venda', type: 'number', step: '0.01' },
          { name: 'loja_digital', label: 'Loja Digital' }
        ]
      },
      {
        id: 'alcadas',
        label: 'Alcada',
        badge: 'Alcada',
        description: 'Nome e percentual de alcada.',
        fields: [
          { name: 'nome', label: 'Nome', required: true },
          { name: 'alcada_percentual', label: 'Alcada (%)', type: 'number', step: '0.01' }
        ]
      },
      {
        id: 'header_clientes',
        label: 'Header Clientes',
        badge: 'Header Clientes',
        description: 'Dicionario de campos da base de clientes.',
        fields: [
          { name: 'campo', label: 'Campo', required: true },
          { name: 'descricao', label: 'Descricao', full: true },
          { name: 'tipo', label: 'Tipo' },
          { name: 'manutencao', label: 'Manutencao' },
          { name: 'fonte', label: 'Fonte' },
          { name: 'comentario', label: 'Comentario', type: 'textarea', full: true }
        ]
      }
    ];

    const loginView = document.getElementById('loginView');
    const adminView = document.getElementById('adminView');
    const userView = document.getElementById('userView');
    const logoutButton = document.getElementById('logoutButton');
    const sessionBadge = document.getElementById('sessionBadge');
    const appTitle = document.getElementById('appTitle');
    const appSubtitle = document.getElementById('appSubtitle');
    const loginForm = document.getElementById('loginForm');
    const loginResult = document.getElementById('loginResult');
    const createUserForm = document.getElementById('createUserForm');
    const createUserResult = document.getElementById('createUserResult');
    const refreshUsersButton = document.getElementById('refreshUsersButton');
    const usersList = document.getElementById('usersList');
    const tabs = document.getElementById('sectionTabs');
    const form = document.getElementById('onboardingForm');
    const resultBox = document.getElementById('resultado');
    let activeSection = sections[0];

    function setView(view, data = {}) {
      loginView.hidden = view !== 'login';
      adminView.hidden = view !== 'admin';
      userView.hidden = view !== 'user';
      logoutButton.hidden = view === 'login';

      if (view === 'admin') {
        appTitle.textContent = 'Painel Admin';
        appSubtitle.textContent = 'Gerencie usuarios, PINs e status dos envios.';
        sessionBadge.textContent = 'Admin';
      } else if (view === 'user') {
        appTitle.textContent = data.user?.nome || 'Onboarding';
        appSubtitle.textContent = 'Preencha as informacoes para o onboarding.';
        sessionBadge.textContent = data.user?.pin || 'Cliente';
      } else {
        appTitle.textContent = 'Onboarding';
        appSubtitle.textContent = 'Acesse com seu PIN para continuar.';
        sessionBadge.textContent = 'Login';
      }
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || 'Nao foi possivel concluir a acao.');
      }

      return result;
    }

    function renderTabs() {
      tabs.innerHTML = sections.map((section, index) => `
        <button
          class="nav-link ${index === 0 ? 'active' : ''}"
          type="button"
          data-section="${section.id}">
          ${section.label}
        </button>
      `).join('');
    }

    function fieldTemplate(field) {
      const colClass = field.full ? 'col-12' : 'col-md-6';
      const requiredClass = field.required ? 'required' : '';
      const requiredAttr = field.required ? 'required' : '';

      if (field.type === 'textarea') {
        return `
          <div class="${colClass}">
            <label class="form-label ${requiredClass}" for="${field.name}">${field.label}</label>
            <textarea class="form-control" id="${field.name}" name="${field.name}" rows="3" ${requiredAttr}></textarea>
          </div>
        `;
      }

      if (field.type === 'select') {
        const options = ['<option value="">Selecione</option>']
          .concat(field.options.map(option => `<option value="${option}">${option}</option>`));
        return `
          <div class="${colClass}">
            <label class="form-label ${requiredClass}" for="${field.name}">${field.label}</label>
            <select class="form-select" id="${field.name}" name="${field.name}" ${requiredAttr}>
              ${options.join('')}
            </select>
          </div>
        `;
      }

      return `
        <div class="${colClass}">
          <label class="form-label ${requiredClass}" for="${field.name}">${field.label}</label>
          <input
            class="form-control"
            id="${field.name}"
            name="${field.name}"
            type="${field.type || 'text'}"
            ${field.step ? `step="${field.step}"` : ''}
            ${requiredAttr}>
        </div>
      `;
    }

    function renderSection(section) {
      activeSection = section;
      document.getElementById('sectionTitle').textContent = section.label;
      document.getElementById('sectionDescription').textContent = section.description;
      document.getElementById('sectionBadge').textContent = section.badge;
      resultBox.innerHTML = '';

      form.innerHTML = `
        <input type="hidden" name="section" value="${section.id}">
        ${section.fields.map(fieldTemplate).join('')}
        <div class="col-12 d-flex flex-column flex-sm-row gap-2 justify-content-end mt-2">
          <button type="reset" class="btn btn-outline-secondary">Limpar</button>
          <button type="submit" class="btn btn-primary">Salvar registro</button>
        </div>
      `;
    }

    async function loadUsers() {
      usersList.innerHTML = '<div class="alert alert-info mb-0">Carregando usuarios...</div>';
      const result = await requestJson('backend/api/admin_users.php?action=list');

      if (result.users.length === 0) {
        usersList.innerHTML = '<div class="alert alert-secondary mb-0">Nenhum usuario criado ainda.</div>';
        return;
      }

      usersList.innerHTML = result.users.map(user => `
        <article class="border rounded-3 p-3 mb-3">
          <div class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-2 mb-3">
            <div>
              <h2 class="h5 mb-1">${escapeHtml(user.nome)}</h2>
              <div class="text-muted small">Criado em ${formatDate(user.created_at)}</div>
            </div>
            <div class="text-md-end">
              <div class="pin-code">${escapeHtml(user.pin)}</div>
              <div class="small text-muted">${user.completed}/${user.total} abas enviadas</div>
            </div>
          </div>
          <div class="status-grid">
            ${user.progress.map(item => `
              <div class="status-chip ${item.sent ? 'sent' : 'missing'}">
                <strong>${escapeHtml(item.label)}</strong><br>
                ${item.sent ? `${item.count} registro(s)` : 'Pendente'}
              </div>
            `).join('')}
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value.replace(' ', 'T'));
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString('pt-BR');
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginResult.innerHTML = '<div class="alert alert-info mb-0">Entrando...</div>';

      try {
        const formData = new FormData(loginForm);
        formData.set('pin', formData.get('pin').toUpperCase().trim());

        const result = await requestJson('backend/api/auth.php?action=login', {
          method: 'POST',
          body: formData
        });

        loginForm.reset();
        loginResult.innerHTML = '';

        if (result.role === 'admin') {
          setView('admin');
          await loadUsers();
        } else {
          setView('user', { user: result.user });
          renderSection(activeSection);
        }
      } catch (error) {
        loginResult.innerHTML = `<div class="alert alert-danger mb-0">${error.message}</div>`;
      }
    });

    createUserForm.addEventListener('submit', async event => {
      event.preventDefault();
      createUserResult.innerHTML = '<div class="alert alert-info mb-0">Gerando PIN...</div>';

      try {
        const result = await requestJson('backend/api/admin_users.php?action=create', {
          method: 'POST',
          body: new FormData(createUserForm)
        });

        createUserForm.reset();
        createUserResult.innerHTML = `
          <div class="alert alert-success mb-0">
            ${result.message}<br>
            <strong>${escapeHtml(result.user.nome)}</strong>: <span class="pin-code">${escapeHtml(result.user.pin)}</span>
          </div>
        `;
        await loadUsers();
      } catch (error) {
        createUserResult.innerHTML = `<div class="alert alert-danger mb-0">${error.message}</div>`;
      }
    });

    refreshUsersButton.addEventListener('click', async () => {
      try {
        await loadUsers();
      } catch (error) {
        usersList.innerHTML = `<div class="alert alert-danger mb-0">${error.message}</div>`;
      }
    });

    logoutButton.addEventListener('click', async () => {
      await requestJson('backend/api/auth.php?action=logout', { method: 'POST' });
      setView('login');
    });

    tabs.addEventListener('click', event => {
      const button = event.target.closest('[data-section]');
      if (!button) return;

      tabs.querySelectorAll('.nav-link').forEach(tab => tab.classList.remove('active'));
      button.classList.add('active');

      const section = sections.find(item => item.id === button.dataset.section);
      renderSection(section);
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      resultBox.innerHTML = '<div class="alert alert-info mb-0">Salvando...</div>';

      try {
        const result = await requestJson('backend/api/save_onboarding.php', {
          method: 'POST',
          body: new FormData(form)
        });

        resultBox.innerHTML = `
          <div class="alert alert-success mb-0">${result.message}</div>
          <pre>${result.sql}</pre>
        `;
        form.reset();
      } catch (error) {
        resultBox.innerHTML = `<div class="alert alert-danger mb-0">${error.message}</div>`;
      }
    });

    async function boot() {
      renderTabs();
      renderSection(activeSection);

      try {
        const result = await requestJson('backend/api/auth.php?action=status');

        if (!result.authenticated) {
          setView('login');
          return;
        }

        if (result.role === 'admin') {
          setView('admin');
          await loadUsers();
          return;
        }

        setView('user', { user: result.user });
      } catch (error) {
        setView('login');
      }
    }

    boot();
  </script>
</body>
</html>
